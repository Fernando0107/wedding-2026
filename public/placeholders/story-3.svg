<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="storyGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d9d9"/>
      <stop offset="100%" style="stop-color:#f9e9e9"/>
    </linearGradient>
    <linearGradient id="storyAccent3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c08787;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#8b5a5a;stop-opacity:0.1"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#storyGradient3)"/>

  <!-- Decorative elements -->
