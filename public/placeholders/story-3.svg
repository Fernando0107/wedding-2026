    <circle cx="26" cy="-15" r="16" fill="#8b5a5a"/>
    <circle cx="26" cy="15" r="16" fill="#8b5a5a"/>
    <circle cx="0" cy="30" r="16" fill="#8b5a5a"/>
    <circle cx="-26" cy="15" r="16" fill="#8b5a5a"/>
    <circle cx="-26" cy="-15" r="16" fill="#8b5a5a"/>
    <circle cx="0" cy="0" r="10" fill="#d4a5a5"/>
  </g>

  <!-- Placeholder text -->
  <text x="320" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#8b5a5a" opacity="0.5">
    Foto de la historia
  </text>
  <text x="320" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#8b5a5a" opacity="0.35">
    Momentos por venir
  </text>
